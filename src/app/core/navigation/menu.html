<header class="sticky top-0 z-50 w-full border-b border-white/10 bg-black/90 backdrop-blur-md transition-all duration-300">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20">
      
      <!-- Logo és Csapat Név (Bal oldal) -->
      <a routerLink="/" (click)="closeMobileMenu()" class="flex items-center gap-3.5 group no-underline text-white">
        <div class="h-12 w-12 sm:h-13 sm:w-13 rounded-2xl bg-white p-1.5 shadow-md flex items-center justify-center shrink-0 transition-transform duration-300 group-hover:scale-105">
          <img
            src="/logo-transparent.png"
            alt="412. Kalazanti Cserkészcsapat Címer"
            class="h-full w-full object-contain"
          />
        </div>
        <div class="flex flex-col">
          <span class="text-xl font-bold tracking-tight text-white group-hover:text-green-400 transition-colors">
            412. Kalazanti
          </span>
          <span class="text-xs font-medium text-gray-400 uppercase tracking-wider">
            Cserkészcsapat
          </span>
        </div>
      </a>

      <!-- Asztali Navigáció (Közép / Jobb oldal) -->
      <nav class="hidden md:flex items-center gap-1.5" aria-label="Főnavigáció">
        @for (route of routes; track route.path) {
          <a
            [routerLink]="route.path"
            routerLinkActive="bg-green-600 text-white font-semibold shadow-lg shadow-green-600/30"
            [routerLinkActiveOptions]="{ exact: route.exact }"
            class="px-4 py-2 rounded-full text-sm font-medium text-gray-300 hover:text-white hover:bg-white/10 transition-all duration-200"
          >
            {{ route.label }}
          </a>
        }
      </nav>

      <!-- Mobil Hamburger Gomb -->
      <div class="flex md:hidden">
        <button
          type="button"
          (click)="toggleMobileMenu()"
          class="inline-flex items-center justify-center p-2.5 rounded-xl text-gray-300 hover:text-white hover:bg-white/10 focus:outline-none"
          aria-label="Menü megnyitása"
          [attr.aria-expanded]="mobileMenuNyitva()"
        >
          @if (!mobileMenuNyitva()) {
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          } @else {
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          }
        </button>
      </div>

    </div>
  </div>

  <!-- Mobil legördülő menü -->
  @if (mobileMenuNyitva()) {
    <div class="md:hidden border-t border-white/10 bg-black/95 px-4 pt-3 pb-6 space-y-1.5 shadow-2xl backdrop-blur-xl">
      @for (route of routes; track route.path) {
        <a
          [routerLink]="route.path"
          (click)="closeMobileMenu()"
          routerLinkActive="bg-green-600 text-white font-semibold"
          [routerLinkActiveOptions]="{ exact: route.exact }"
          class="block px-4 py-3 rounded-xl text-base font-medium text-gray-300 hover:text-white hover:bg-white/10 transition-all"
        >
          {{ route.label }}
        </a>
      }
    </div>
  }
</header>
