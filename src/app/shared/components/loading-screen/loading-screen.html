<div [class]="teljesKepernyo() ? 'fixed inset-0 z-50 flex items-center justify-center bg-black px-4' : 'flex flex-col items-center justify-center py-20 px-4 w-full'">
  <div class="flex flex-col items-center text-center">
    <!-- Egyszerű zöld spinner közepén a cserkész logóval -->
    <div class="relative w-16 h-16 mb-4 flex items-center justify-center">
      <div class="w-16 h-16 rounded-full border-3 border-white/10 border-t-green-500 animate-spin"></div>
      <div class="absolute w-9 h-9 rounded-full bg-white p-1 flex items-center justify-center shadow">
        <img src="/logo-transparent.png" alt="Kalazanti Cserkészcsapat" class="h-full w-full object-contain" />
      </div>
    </div>
    
    <p class="text-white font-medium text-base tracking-wide">{{ szoveg() }}</p>
    <p class="text-gray-400 text-xs mt-1">{{ alcim() }}</p>
  </div>
</div>
