<section class="min-h-screen bg-black pt-32 pb-24 px-4 sm:px-6 lg:px-8 text-white">
  <div class="max-w-4xl mx-auto">
    @if (cikk()) {
      <article class="bg-[#131613] rounded-3xl p-6 sm:p-10 shadow-2xl border border-white/10">
        <a [routerLink]="['/hirek']" class="inline-flex items-center gap-2 text-green-400 hover:text-green-300 font-semibold mb-6 transition-colors cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          Vissza a hírekhez
        </a>

        <h1 class="text-3xl sm:text-4xl font-bold text-white mb-6 leading-tight">
          {{ cikk()?.title }}
        </h1>

        <div class="cikk-tartalom text-gray-300 leading-relaxed text-base sm:text-lg" [innerHTML]="cikk()?.content"></div>
      </article>
    } @else if (hiba()) {
      <div class="text-center py-16 bg-red-950/20 rounded-3xl border border-red-500/30 max-w-xl mx-auto p-8">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-14 h-14 mx-auto text-red-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <h3 class="text-xl font-bold text-red-200 mb-2">Hiba a cikk betöltésekor</h3>
        <p class="text-gray-300 text-sm mb-6">{{ hiba() }}</p>
        <a [routerLink]="['/hirek']" class="inline-flex items-center gap-2 px-6 py-2.5 rounded-full bg-white/10 hover:bg-white/20 text-white font-medium transition-colors cursor-pointer">
          Vissza a hírekhez
        </a>
      </div>
    } @else {
      <app-loading-screen
        [szoveg]="'Cikk betöltése folyamatban...'"
        [alcim]="'412. Kalazanti Szent József Cserkészcsapat'"
      />
    }
  </div>
</section>
