<div class="hirek-container">
  <h2>Legfrissebb híreink</h2>
  
  @if (hirekLista().length === 0) {
    <div class="nincs-hir">
      <p>Jelenleg nincsenek elérhető hírek.</p>
    </div>
  }

  <div class="hirek-grid">
    @for (aktualisHir of hirekLista(); track aktualisHir.url) {
      <app-hir-elem [adat]="aktualisHir" />
    }
  </div>
</div>
