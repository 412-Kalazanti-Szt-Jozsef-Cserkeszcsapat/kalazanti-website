<div class="hirek-container">
  <h2>Legfrissebb híreink</h2>
  
  <!-- Ellenőrizzük, hogy vannak-e egyáltalán hírek -->
  <div *ngIf="hirekLista.length === 0" class="nincs-hir">
    <p>Jelenleg nincsenek elérhető hírek.</p>
  </div>

  <!-- Végigmegyünk a hirekLista tömbön, és minden elemet átadunk a gyermek komponensnek -->
  <div class="hirek-grid">
    <app-hir-elem 
      *ngFor="let aktualisHir of hirekLista" 
      [adat]="aktualisHir">
    </app-hir-elem>
  </div>
</div>
