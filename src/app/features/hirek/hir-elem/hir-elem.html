<article class="hir-card group flex flex-col h-full bg-[#131613] rounded-3xl overflow-hidden border border-white/10 hover:border-green-500/50 shadow-xl hover:shadow-green-500/10 transition-all duration-300 transform hover:-translate-y-1.5 cursor-pointer" [routerLink]="['/hirek', adat().url]">
  <!-- Kép konténer -->
  <div class="relative w-full h-52 sm:h-56 bg-stone-900 overflow-hidden shrink-0">
    @if (teljesKepUrl()) {
      <img
        [src]="teljesKepUrl()"
        [alt]="adat().title"
        class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
        loading="lazy"
      >
    } @else {
      <div class="w-full h-full flex items-center justify-center bg-gradient-to-tr from-green-950 to-emerald-900 text-white/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-14 h-14" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
      </div>
    }
  </div>

  <!-- Szöveges tartalom: középre zárt cím és bevezető -->
  <div class="flex flex-col flex-grow p-6 text-center justify-center">
    <h3 class="text-xl font-bold text-white group-hover:text-green-400 transition-colors mb-3 leading-snug">
      {{ adat().title }}
    </h3>
    @if (kivonat()) {
      <p class="text-sm text-gray-400 leading-relaxed line-clamp-3">
        {{ kivonat() }}
      </p>
    }
  </div>

  <!-- Alsó információs sáv (Szerző és Dátum) -->
  <div class="mt-auto px-5 py-3.5 bg-black/60 border-t border-white/5 flex items-center justify-between text-xs text-gray-400 font-medium">
    <div class="flex items-center gap-1.5 truncate max-w-[60%]">
      <!-- Chat bubble ikon -->
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-green-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
      </svg>
      <span class="truncate text-gray-300">{{ szerzo() }}</span>
    </div>
    @if (datum()) {
      <div class="text-gray-400 whitespace-nowrap ml-2">
        {{ datum() }}
      </div>
    }
  </div>
</article>
