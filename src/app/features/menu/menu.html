<nav class="fixed top-0 left-0 z-50 flex w-full items-center justify-between px-6 py-6 md:px-10">
  <!-- Logo Section (Left) -->
  <a routerLink="" class="flex items-center gap-3 text-white no-underline transition-opacity hover:opacity-85 rounded-3xl  p-1 backdrop-blur-md shadow-lg">
    <img src="logo-transparent.png" alt="logo" class="h-16 w-16 object-contain brightness-0 invert filter">
  </a>

  <!-- Navigation Menu (Right - Pill Shape) -->
  <div class="flex items-center gap-1 rounded-full border border-white/10 bg-[#111]/50 px-1 p-1 backdrop-blur-md shadow-lg">
    @for (route of routes; track route.path) {
      <a [routerLink]="route.path"
      routerLinkActive="bg-green-500 text-white shadow-md font-semibold"
      [routerLinkActiveOptions]="{ exact: route.exact }"
      class="m-plus-rounded-1c-bold rounded-full px-5 py-3 text-sm font-medium text-gray-300 transition-all duration-200 hover:text-white hover:bg-white/5">
        {{ route.label }}
      </a>
    }

    <!-- Extra Támogatás Gomb -->
    <a [href]="donationUrl"
       target="_blank"
       rel="noopener noreferrer"
       class="m-plus-rounded-1c-bold flex items-center gap-1.5 rounded-full bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 px-4 py-2.5 text-sm font-bold text-stone-950 shadow-md shadow-amber-500/20 transition-all duration-200 hover:shadow-lg hover:shadow-amber-500/35 active:scale-95">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 fill-current text-stone-950" viewBox="0 0 24 24">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
      </svg>
      <span>Támogatás</span>
    </a>

    <div class="flex items-center">
      <a href="https://www.facebook.com/kalazanti" class="flex items-center justify-center rounded-full p-2 transition-all duration-200 hover:bg-white/5" target="_blank">
        <img src="/img/facebook_logo_128.png" alt="Facebook Logo" class="h-7 w-7">
      </a>
      <a href="https://www.instagram.com/412kalazanti/" class="flex items-center justify-center rounded-full p-2 transition-all duration-200 hover:bg-white/5" target="_blank">
        <img src="/img/instagram_logo_128.png" alt="Facebook Logo" class="h-7 w-7">
      </a>
      <a href="https://www.tiktok.com/@412kalazanti" class="flex items-center justify-center rounded-full p-2 transition-all duration-200 hover:bg-white/5" target="_blank">
        <img src="/img/tiktok_logo_128.png" alt="Facebook Logo" class="h-8 w-8">
      </a>
    </div>
  </div>
</nav>
