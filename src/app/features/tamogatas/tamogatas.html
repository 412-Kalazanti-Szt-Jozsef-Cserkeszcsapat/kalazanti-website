<section class="donation-page">
  <div class="donation-shell">
    <header class="donation-header">
      <img
        src="/logo-transparent.png"
        alt="Kalazanti Cserkészcsapat"
        width="64"
        height="64"
        class="team-crest"
      />
      <p class="eyebrow">KÖZÖS ÉLMÉNYEK. KÖZÖS JÖVŐ.</p>
      <h1>Adj lendületet a következő kalandnak!</h1>
      <p>
        Támogasd cserkészcsapatunk mindennapjait, táborait és közösségét.<br
          class="desktop-break"
        />
        Minden felajánlás számít.
      </p>
    </header>

    <form (submit)="onSubmit($event)" class="donation-card">
      <app-donation-options class="donation-options" />
      <app-donation-checkout
        class="donation-checkout"
        role="region"
        aria-label="Támogatás összegzése"
      />
    </form>

    <app-alternative-donations [purpose]="store.selectedType()?.title" />
  </div>
</section>
